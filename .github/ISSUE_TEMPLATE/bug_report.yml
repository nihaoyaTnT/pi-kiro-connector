name: Bug report
description: Report a reproducible connector problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, access or refresh tokens, authorization callback URLs/codes, company Start URLs, client secrets, device codes, private request content, or Pi auth files.
  - type: input
    id: pi-version
    attributes:
      label: Pi version
      placeholder: 0.83.0
    validations:
      required: true
  - type: input
    id: connector-version
    attributes:
      label: Connector version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: auth-method
    attributes:
      label: Authentication method
      options: [AWS Builder ID, AWS IAM Identity Center, Kiro API key, KIRO_API_KEY environment variable]
    validations:
      required: true
  - type: input
    id: region
    attributes:
      label: Authentication or data-plane region
      placeholder: us-east-1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected behavior, actual behavior, and minimal reproduction steps.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove credentials, tokens, callback URLs/codes, company Start URLs, client metadata, device codes, conversation content, and private paths before pasting logs.
      render: shell
